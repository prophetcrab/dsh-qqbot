name: Architecture and tests

on:
  push:
    branches: [dshbot-mac]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    env:
      QQBOT_SOURCE: ${{ github.workspace }}/qq-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: prophetcrab/qq-bot
          path: qq-bot
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install SVG renderer
        run: brew install librsvg
      - name: Unit and contract tests
        run: npm test
      - name: Install template dependencies
        run: npm ci --prefix template --no-audit --no-fund
      - name: Template tests
        run: npm run test:template
      - name: Client bundle drift
        run: npm run build:client -- --check
      - name: Architecture guard
        run: npm run check:architecture
      - name: Template drift
        run: node scripts/sync-template.mjs --check
      - name: Release package contents
        run: |
          node -e "const fs = require('node:fs'); const p = 'template/runtime-bundles/node_modules-darwin-arm64.tar.gz'; if (!fs.existsSync(p) || fs.statSync(p).size < 1024) { console.error('missing ' + p); process.exit(1) }"
          npm pack --dry-run >/dev/null
