name: Windows checks

on:
  push:
    branches: [dshbot-win64]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install host dependencies
        run: npm install --no-audit --no-fund
      - name: Unit and contract tests
        run: npm test
      - name: Client bundle drift
        run: npm run build:client -- --check
      - name: Architecture guard
        run: npm run check:architecture
      - name: Install template dependencies
        run: npm ci --prefix template --no-audit --no-fund
      - name: Template tests
        run: npm run test:template
